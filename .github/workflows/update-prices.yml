name: Update Fuel Prices

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 11:00 EEST (summer)
    - cron: '0 9 * * *'   # 09:00 UTC = 11:00 EET (winter)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Geocode new addresses
        run: python scripts/geocode.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "Update prices for $(date +%Y-%m-%d)"
          git push
