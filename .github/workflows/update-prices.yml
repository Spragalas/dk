name: Update Fuel Prices

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Hard cap so a hung download (e.g. the Playwright SharePoint fallback)
    # fails the run quickly instead of burning the default 6h job limit.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Geocode new addresses
        run: python scripts/geocode.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "Update prices for $(date +%Y-%m-%d)"
          git push
