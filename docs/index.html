<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Degalų kainos Lietuvoje</title>
  <meta name="description" content="Degalų kainos visose Lietuvos degalinėse. Atnaujinama kasdien.">
  <meta name="theme-color" content="#4c8bf5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pilnas Bakas">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="panel-header">
      <div>
        <h1>Degalų kainos</h1>
        <div id="date-section">
          <select id="history-select" title="Istorija"></select>
        </div>
      </div>
      <div style="display:flex;gap:4px;flex-shrink:0;margin-top:2px">
        <button id="theme-toggle" title="Keisti temą">&#9788;</button>
        <button id="panel-toggle" title="Sutraukti/Išskleisti">&#9650;</button>
      </div>
    </div>

    <div id="panel-body">

    <div id="fuel-tabs">
      <button class="fuel-tab active" data-fuel="petrol95">95 benzinas</button>
      <button class="fuel-tab" data-fuel="diesel">Dyzelinas</button>
      <button class="fuel-tab" data-fuel="lpg">SND</button>
    </div>

    <div id="averages"></div>

    <div id="nearme">
      <div id="nearme-controls">
        <button id="nearme-btn" title="Rasti artimiausias degalines">&#9737; Šalia manęs</button>
        <div id="nearme-radius">
          <label for="radius-input">Spindulys:</label>
          <select id="radius-input">
            <option value="5">5 km</option>
            <option value="10" selected>10 km</option>
            <option value="15">15 km</option>
            <option value="25">25 km</option>
            <option value="50">50 km</option>
          </select>
        </div>
      </div>
      <div id="nearme-status"></div>
    </div>

    <div id="filters">
      <div class="filter-section">
        <label>Tinklas:</label>
        <div class="multi-select" id="company-filter">
          <button class="multi-select-btn" type="button">
            <span class="multi-select-label">Visi</span>
            <span class="multi-select-arrow">▾</span>
          </button>
          <div class="multi-select-dropdown">
            <div class="multi-select-actions">
              <button type="button" data-action="all">Visi</button>
              <button type="button" data-action="none">Joks</button>
            </div>
            <div class="multi-select-options"></div>
          </div>
        </div>
      </div>
      <div class="filter-section">
        <label>Regionas:</label>
        <div class="multi-select" id="region-filter">
          <button class="multi-select-btn" type="button">
            <span class="multi-select-label">Visi</span>
            <span class="multi-select-arrow">▾</span>
          </button>
          <div class="multi-select-dropdown">
            <div class="multi-select-actions">
              <button type="button" data-action="all">Visi</button>
              <button type="button" data-action="none">Joks</button>
            </div>
            <div class="multi-select-options"></div>
          </div>
        </div>
      </div>
      <div class="filter-section">
        <label for="search-input">Paieška:</label>
        <input type="text" id="search-input" placeholder="Adresas arba miestas..." />
      </div>
    </div>

    <div id="cluster-mode">
      <label>Grupėje rodyti:</label>
      <div id="mode-tabs">
        <button class="mode-tab active" data-mode="min">Min</button>
        <button class="mode-tab" data-mode="max">Max</button>
      </div>
    </div>

    <div id="legend">
      <div class="legend-title">Kaina vs vidurkis</div>
      <div class="legend-row"><span class="dot" style="background:#34d399"></span> Pigiau</div>
      <div class="legend-row"><span class="dot" style="background:#fbbf24"></span> Apie vidurkį</div>
      <div class="legend-row"><span class="dot" style="background:#f87171"></span> Brangiau</div>
    </div>

    <div id="stats"></div>

    <div id="views">
      <button id="list-btn" title="Visų degalinių sąrašas">&#9776; Sąrašas</button>
      <button id="trends-btn" title="Kainų tendencijos">&#9650; Tendencijos</button>
      <button id="route-btn" title="Pigiausios degalinės kelyje">&#9654; Maršrutas</button>
    </div>

    <button id="install-btn" class="hidden" title="Įdiegti programėlę">&#11015; Įdiegti programėlę</button>

    <div id="attribution">
      Duomenys: <a href="https://www.ena.lt" target="_blank">LEA</a> |
      Žemėlapis: <a href="https://www.openstreetmap.org" target="_blank">OSM</a><br>
      <a href="https://github.com/Spragalas/dk/issues" target="_blank">Pranešti apie klaidą</a>
    </div>

    </div><!-- end panel-body -->
  </div>

  <!-- Side panel for list/trends -->
  <div id="side-panel" class="side-panel hidden">
    <div id="side-panel-header">
      <h2 id="side-panel-title"></h2>
      <button id="side-panel-close">&times;</button>
    </div>

    <!-- Station List View -->
    <div id="list-view" class="side-view hidden">
      <div id="list-controls">
        <div id="list-fuel-tabs">
          <button class="list-fuel-tab active" data-fuel="petrol95">95 benzinas</button>
          <button class="list-fuel-tab" data-fuel="diesel">Dyzelinas</button>
          <button class="list-fuel-tab" data-fuel="lpg">SND</button>
        </div>
        <input type="text" id="list-search" placeholder="Ieškoti pagal pavadinimą ar adresą..." />
      </div>
      <div id="list-sort">
        <span>Rūšiuoti:</span>
        <button class="sort-btn active" data-sort="price">Kaina</button>
        <button class="sort-btn" data-sort="company">Tinklas</button>
        <button class="sort-btn" data-sort="address">Adresas</button>
      </div>
      <div id="station-list"></div>
    </div>

    <!-- Route View -->
    <div id="route-view" class="side-view hidden">
      <div id="route-fuel-tabs">
        <button class="route-fuel-tab active" data-fuel="petrol95">95 benzinas</button>
        <button class="route-fuel-tab" data-fuel="diesel">Dyzelinas</button>
        <button class="route-fuel-tab" data-fuel="lpg">SND</button>
      </div>
      <div id="route-controls">
        <div class="route-input-row">
          <label>A</label>
          <div class="route-input-wrap">
            <input type="text" id="route-start-input" placeholder="Ieškoti adreso..." autocomplete="off" />
            <div id="route-start-suggestions" class="route-suggestions"></div>
          </div>
          <button class="route-action-btn" id="route-start-locate" title="Mano vieta">&#9737;</button>
          <button class="route-action-btn" id="route-start-pick" title="Pasirinkti žemėlapyje">&#9871;</button>
        </div>
        <div class="route-input-row">
          <label>B</label>
          <div class="route-input-wrap">
            <input type="text" id="route-end-input" placeholder="Ieškoti adreso..." autocomplete="off" />
            <div id="route-end-suggestions" class="route-suggestions"></div>
          </div>
          <button class="route-action-btn" id="route-end-locate" title="Mano vieta">&#9737;</button>
          <button class="route-action-btn" id="route-end-pick" title="Pasirinkti žemėlapyje">&#9871;</button>
        </div>
        <div id="route-options-row">
          <div id="route-corridor">
            <label for="route-radius">Nuo kelio:</label>
            <select id="route-radius">
              <option value="2">2 km</option>
              <option value="5" selected>5 km</option>
              <option value="10">10 km</option>
            </select>
          </div>
          <button id="route-clear">Išvalyti</button>
        </div>
      </div>
      <div id="route-status"></div>
      <div id="route-results"></div>
    </div>

    <!-- Price Trends View -->
    <div id="trends-view" class="side-view hidden">
      <div id="trends-fuel-tabs">
        <button class="trends-fuel-tab" data-fuel="all">Visi degalai</button>
        <button class="trends-fuel-tab active" data-fuel="petrol95">95 benzinas</button>
        <button class="trends-fuel-tab" data-fuel="diesel">Dyzelinas</button>
        <button class="trends-fuel-tab" data-fuel="lpg">SND</button>
      </div>
      <div id="trends-chart"></div>
      <div id="trends-table"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
